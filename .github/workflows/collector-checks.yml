name: Collector Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update system CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip certifi
      - name: Set Python CA bundle
        run: echo "SSL_CERT_FILE=$(python -m certifi)" >> "$GITHUB_ENV"
      - name: Compile Python
        run: python -m compileall -q collector tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package source artifact
        run: zip -r collector-source.zip collector tests README.md requirements.txt urls.txt .github/workflows/collector-checks.yml
      - uses: actions/upload-artifact@v4
        with:
          name: collector-source
          path: collector-source.zip
          retention-days: 14
