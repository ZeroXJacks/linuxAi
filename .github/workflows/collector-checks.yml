
name: Collector Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and Source Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q collector tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Package source
        run: |
          zip -r collector-source.zip \
            collector tests README.md requirements.txt \
            urls.txt .github/workflows/collector-checks.yml \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload source artifact
        uses: actions/upload-artifact@v6
        with:
          name: collector-source
          path: collector-source.zip
          retention-days: 14

  collect:
    name: Authorized HTML Collection
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          ALLOWED_HOSTS: ${{ vars.COLLECTOR_ALLOWED_HOSTS }}
        run: |
          if [ -z "$ALLOWED_HOSTS" ]; then
            echo "::error::Set COLLECTOR_ALLOWED_HOSTS in repository variables."
            exit 1
          fi

          if [ ! -s urls.txt ]; then
            echo "::error::urls.txt is empty."
            exit 1
          fi

          mkdir -p collected

      - name: Run authorized collector
        env:
          ALLOWED_HOSTS: ${{ vars.COLLECTOR_ALLOWED_HOSTS }}
        shell: bash
        run: |
          IFS=',' read -ra HOSTS <<< "$ALLOWED_HOSTS"

          args=()
          for host in "${HOSTS[@]}"; do
            host="$(echo "$host" | xargs)"
            if [ -n "$host" ]; then
              args+=(--allow-host "$host")
            fi
          done

          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::No valid allowed hosts."
            exit 1
          fi

          python -m collector \
            --urls urls.txt \
            --output collected \
            --delay 1 \
            --max-bytes 2097152 \
            "${args[@]}"

      - name: Verify collection results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = Path("collected/index.json")
          if not index.exists():
              raise SystemExit("Collection index was not generated.")

          data = json.loads(index.read_text(encoding="utf-8"))
          pages = data.get("pages", [])

          print(f"Successfully saved: {len(pages)} page(s)")
          print(f"Errors: {len(data.get('errors', {}))}")

          if not pages:
              raise SystemExit("No pages were collected.")
          PY

      - name: Upload collected pages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: collected-html
          path: collected/
          if-no-files-found: warn
          retention-days: 7
